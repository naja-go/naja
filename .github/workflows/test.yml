name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPRIVATE: github.com/naja-go/gpflag

jobs:


  lic-headers:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - run: >-
          docker run
          -v $(pwd):/wrk -w /wrk
          ghcr.io/google/addlicense
          -c 'The Cobra Authors'
          -y '2013-2023'
          -l apache
          -ignore '.github/**'
          -check
          .


  golangci-lint:
    permissions:
      contents: read  # for actions/checkout to fetch code
      pull-requests: read  # for golangci/golangci-lint-action to fetch pull requests
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - &download-gpflag
        name: Download private gpflag dependency
        shell: bash
        env:
          GPFLAG_READ_TOKEN: ${{ secrets.GPFLAG_READ_TOKEN }}
        run: |
          if [[ -z "$GPFLAG_READ_TOKEN" ]]; then
            echo '::error::Set GPFLAG_READ_TOKEN to a token with Contents: read access to naja-go/gpflag.'
            exit 1
          fi
          auth=$(printf 'x-access-token:%s' "$GPFLAG_READ_TOKEN" | base64 | tr -d '\r\n')
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0='http.https://github.com/naja-go/gpflag.extraheader' \
          GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
          go mod download github.com/naja-go/gpflag

      - uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: latest
          install-mode: goinstall
          args: --verbose


  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - *download-gpflag

      - run: go test -v ./...
